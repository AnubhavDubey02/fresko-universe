[project]
name = "fresko_universe"
authors = [
    { name = "Fresko", email = "dev@fresko.local"}
]
description = "Fresko Universe — Produce Trade OS (Container + Deal Phase 1)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 110
target-version = "py310"
