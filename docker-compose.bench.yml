# Optional local MariaDB/Redis for scripts/ci_bench.sh (Gate 2).
# Full Frappe/ERPNext process still runs on host via bench — not a fake CI.
services:
  mariadb:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
  redis:
    image: redis:7
    ports:
      - "6379:6379"
