user freskoqa;
worker_processes 1;
pid /home/freskoqa/fresko-private-staging-20261017/run/nginx.pid;
error_log /home/freskoqa/fresko-private-staging-20261017/logs/https-error.log;
events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 access_log /home/freskoqa/fresko-private-staging-20261017/logs/https-access.log;
 server {
  listen 127.0.0.1:18443 ssl;
  server_name fresko-staging.34.93.162.135.sslip.io;
  ssl_certificate /etc/letsencrypt/live/fresko-staging.34.93.162.135.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fresko-staging.34.93.162.135.sslip.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 10m;
  location /assets/ { alias /home/freskoqa/fresko-private-staging-20261017/sites/assets/; }
  location / {
   proxy_pass http://127.0.0.1:18081;
   proxy_set_header Host $host;
   proxy_set_header X-Frappe-Site-Name fresko-staging.34.93.162.135.sslip.io;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_read_timeout 180s;
  }
 }
}
